name: Extract and Load PRD
on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  extract_load:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: prd
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit install

      - name: Run pre-commit tests
        run: pre-commit run --all-files

      - name: Install Singer tap dependencies
        run: |
          pip install pytest
          pip install -r requirements_singer.txt
          pip install -e ./singer_tap/

      - name: Run Singer tap tests
        run: |
          pytest tests/

      - name: Extract and Load to Snowflake
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_ID }}
          SNOWFLAKE_USER: ${{ secrets.SPACEX_DATA_PRD_TRANSFORM_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SPACEX_DATA_PRD_TRANSFORM_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ vars.SPACEX_DATA_PRD_TRANSFORM_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SPACEX_DATA_PRD_TRANSFORM_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ vars.SPACEX_DATA_PRD_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SPACEX_DATA_PRD_SCHEMA }}
        run: |
          # Configure Singer tap with Snowflake credentials
          python -c "
          import json
          import os

          config = {
              'account': os.environ['SNOWFLAKE_ACCOUNT'],
              'user': os.environ['SNOWFLAKE_USER'],
              'password': os.environ['SNOWFLAKE_PASSWORD'],
              'role': os.environ['SNOWFLAKE_ROLE'],
              'warehouse': os.environ['SNOWFLAKE_WAREHOUSE'],
              'database': os.environ['SNOWFLAKE_DATABASE'],
              'schema': os.environ['SNOWFLAKE_SCHEMA']
          }

          with open('include/singer_tap/runner/config_snowflake.json', 'w') as f:
              json.dump(config, f)
          "

          # Run the Singer tap to extract and load data
          cd singer_tap
          python runner/tap_spacex_runner.py
