version: 2

models:
  - name: stg_spacex_data__capsule
    columns:
      - name: capsule_id
        description: This is a unique identifier of a Space X capsule
        tests:
          - unique
          - not_null
      - name: capsule_status
        description: The status of a launches' capsule
        tests:
          - accepted_values:
              values: ["unknown", "active", "retired", "destroyed"]
              config:
                severity: warn

  - name: stg_spacex_data__core
    columns:
      - name: core_id
        description: This is a unique identifier of a Space X cores
        tests:
          - unique
          - not_null
      - name: core_status
        description: The status of a launches' core
        tests:
          - accepted_values:
              values: ["active", "inactive", "unknown", "expended", "lost", "retired"]
              config:
                severity: warn

  - name: stg_spacex_data__crew
    columns:
      - name: crew_id
        description: This is a unique identifier of a Space X crew
        tests:
          - unique
          - not_null
      - name: crew_status
        description: The status of a launches' core
        tests:
          - accepted_values:
              values: ["active", "inactive", "retired", "unknown"]
              config:
                severity: warn

  - name: stg_spacex_data__launch
    columns:
      - name: launch_id
        description: This is a unique identifier of a Space X launch
        tests:
          - unique
          - not_null
      - name: launch_date_utc
        tests:
          - not_null
          - launch_date_not_future
      - name: launch_date_precision
        description: The status of a launches
        tests:
          - accepted_values:
              values: ["half", "quarter", "year", "month", "day", "hour"]
              config:
                severity: warn

  - name: stg_spacex_data__launchpad
    columns:
      - name: launchpad_id
        description: This is a unique identifier of a Space X launchpads
        tests:
          - unique
          - not_null
      - name: launchpad_status
        description: The status of a launches' core
        tests:
          - accepted_values:
              values: ["active", "inactive", "unknown", "retired", "lost", "under construction"]
              config:
                severity: warn

  - name: stg_spacex_data__payload
    columns:
      - name: payload_mass_kg
        tests:
          - payload_mass_within_bounds
