version: 2

# Import custom tests
tests:
  - tests/data/custom_data_tests.sql


models:
  - name: pbl_spacex_data_fct__launch
    columns:
      - name: launch_id
        description: Primary key for the launch
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_spacex_data__launch')
              field: launch_id
      - name: total_payload_mass_kg
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
          - reasonable_payload_mass_kg
      - name: launch_date_utc
        tests:
          - launch_date_not_future
      - name: launch_is_success
        tests:
          - success_rate_valid_range

  - name: pbl_spacex_data_fct__payload
    description: Fact table containing payload launch information and metrics
    columns:
      - name: payload_id
        description: Unique identifier for the payload
        tests:
          - unique
          - not_null
      - name: payload_launch_id
        description: Foreign key to the launch
        tests:
          - not_null
          - relationships:
              to: ref('stg_spacex_data__launch')
              field: launch_id
      - name: payload_type
        description: Type of payload
        tests:
          - not_null
      - name: payload_mass_kg
        description: Mass of the payload in kilograms
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100000
      - name: payload_orbit
        description: Target orbit for the payload
        tests:
          - not_null
      - name: payload_successful_mass_kg
        description: Mass of successfully delivered payload
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: payload_successful_delivery
        description: Flag indicating successful payload delivery
        tests:
          - not_null

  - name: pbl_spacex_data_fct__starlink
    description: Fact table containing Starlink satellite information and operational metrics
    columns:
      - name: starlink_id
        description: Unique identifier for the Starlink satellite
        tests:
          - unique
          - not_null
      - name: starlink_launch_id
        description: Foreign key to the launch
        tests:
          - not_null
          - relationships:
              to: ref('stg_spacex_data__launch')
              field: launch_id
      - name: starlink_satellite_version
        description: Starlink satellite version
        tests:
          - not_null
      - name: starlink_height_km
        description: Orbital height in kilometers
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1000
      - name: starlink_velocity_kms
        description: Orbital velocity in kilometers per second
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 7.0
              max_value: 8.0
      - name: orbital_status
        description: Status based on orbital height
        tests:
          - not_null
          - accepted_values:
              values: ['Operational', 'Below Operational', 'Above Operational', 'Unknown']
      - name: velocity_status
        description: Status based on orbital velocity
        tests:
          - not_null
          - accepted_values:
              values: ['Nominal', 'Sub-nominal', 'Super-nominal', 'Unknown']
